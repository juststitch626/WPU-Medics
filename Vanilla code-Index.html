## Vanilla Code- Index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WPU Digital Clinic Book</title>
  <link rel="icon" href="wpu-logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Faded WPU logo wallpaper behind the phone frame -->
  <div class="wallpaper" aria-hidden="true"></div>

  <!-- The whole app renders inside this phone-shaped frame -->
  <div class="device">
    <div class="device__notch"></div>
    <div id="app" class="device__screen"></div>
  </div>

  <!-- All source files live in THIS SAME FOLDER (no subfolders), loaded
       in dependency order. Classic <script> tags are used (not modules)
       so the app runs by simply opening index.html — no server or build.

       Load order matters:
         1. data / auth / ui   (ui.js creates the window.Screens registry)
         2. each screen file    (they register onto window.Screens)
         3. router              (defines navigation + guards)
         4. app                 (boots the app on the login screen)          -->
  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="ui.js"></script>

  <script src="login.js"></script>
  <script src="patientDashboard.js"></script>
  <script src="nurseDashboard.js"></script>
  <script src="appointments.js"></script>
  <script src="records.js"></script>
  <script src="history.js"></script>
  <script src="workflow.js"></script>

  <script src="router.js"></script>
  <script src="app.js"></script>
</body>
</html>
